                color: #ffffff;

            body::before {
                content: "";

                inset: 0;
                pointer-events: none;
                z-index: 999;
                background:
                    radial-gradient(circle at 20% 20%, rgba(255, 193, 7, .07), transparent 25%),

            }

            }

            .container {
                width: min(1180px, calc(100% - 40px));
                margin: 0 auto;
            }

            /* =====================================================
               TOP BAR
            ===================================================== */

            .topbar {
                background: linear-gradient(90deg, #ff7a00, #ffb300, #ff7a00);
                color: #07111f;
                overflow: hidden;
                position: relative;

                letter-spacing: 1.5px;

            @keyframes pulseText {

                }

               HEADER

                top: 0;

                align-items: center;
                justify-content: space-between;
                gap: 30px;

                align-items: center;
                gap: 12px;
                text-decoration: none;

                cursor: pointer;
                font-weight: 800;

               HERO
            ===================================================== */

            .hero {

                display: flex;
                align-items: center;
                overflow: hidden;
                background:
                    radial-gradient(circle at 75% 25%, rgba(255, 179, 0, .20), transparent 25%),
                    radial-gradient(circle at 15% 75%, rgba(30, 136, 229, .25), transparent 35%),
                    linear-gradient(135deg, #07111f, #102642 60%, #081321);
            }

            .hero::before {
                content: "";
                position: absolute;
                width: 600px;
                height: 600px;
                right: -180px;
                top: -200px;
                border-radius: 50%;
                border: 1px solid rgba(255,255,255,.08);
                box-shadow:
                    0 0 0 80px rgba(255,255,255,.02),
                    0 0 0 160px rgba(255,255,255,.015);
            }

            .hero::after {
                content: "";
                position: absolute;
                width: 280px;
                height: 280px;
                left: -100px;
                bottom: -140px;
                border-radius: 50%;
                background: rgba(255, 122, 0, .12);
                filter: blur(30px);

            .hero-content {
                position: relative;
                z-index: 2;
                max-width: 850px;
                padding: 90px 0;

                align-items: center;
                gap: 9px;
                padding: 9px 15px;
                border: 1px solid rgba(255, 193, 7, .35);
                border-radius: 999px;
                background: rgba(255, 193, 7, .08);
                color: #ffc107;
                font-size: 13px;
                font-weight: 900;
                letter-spacing: 1.4px;
                text-transform: uppercase;
                margin-bottom: 25px;

            .eyebrow-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #43e97b;
                box-shadow: 0 0 14px #43e97b;

                    transform: scale(1);

                    transform: scale(.7);

                letter-spacing: -6px;

            }

                color: #ffc107;
            }

                max-width: 700px;
                margin: 30px 0 0;
                color: #c7d5e6;
                font-size: clamp(18px, 2.2vw, 23px);
                line-height: 1.55;
            }

            .hero-buttons {
                display: flex;
                flex-wrap: wrap;
                gap: 14px;
                margin-top: 36px;

            .button {

                justify-content: center;

                color: #fff;

               FLOATING RV
            ===================================================== */

                align-items: center;

            /* =====================================================
               FOOTER
            ===================================================== */

            }

            .copyright {

            }

            /* =====================================================
               SCROLL TOP
            ===================================================== */

            #scroll-top {
                position: fixed;
                right: 22px;
                bottom: 22px;
                width: 50px;
                height: 50px;
                display: grid;
                place-items: center;
                border-radius: 15px;

                font-size: 22px;
                font-weight: 1000;
                text-decoration: none;
                box-shadow: 0 12px 30px rgba(0,0,0,.35);
                opacity: 0;
                visibility: hidden;
                transform: translateY(15px);
                transition: .25s ease;
                z-index: 200;
            }

            #scroll-top.visible {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
            }

            /* =====================================================
               PARTICLES
            ===================================================== */

            .particle {
                position: absolute;
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: #ffc107;
                opacity: .5;
                pointer-events: none;
                animation: particleFloat linear infinite;
            }

            @keyframes particleFloat {
                from {
                    transform: translateY(0);
                    opacity: 0;
                }

                20% {
                    opacity: .6;
                }

                80% {
                    opacity: .3;
                }

                to {
                    transform: translateY(-800px);
                    opacity: 0;
                }
            }

            /* =====================================================
               MOBILE

            @media (max-width: 850px) {

                .adventure-grid,

                    grid-template-columns: 1fr;
                }

                .feature-grid {

            }

            @media (max-width: 560px) {

                }

                    flex-direction: column;
                }

                .map {
                    min-height: 350px;
                }

                .map iframe {
                    min-height: 350px;
                }
            }
        `;

                                <p>
                                    The open road isn't going anywhere.
                                    But your next adventure doesn't have to wait.
                                </p>
                            </article>

                        </div>

                    </div>

                </section>


                <section class="contact" id="contact">

                    <div class="container contact-grid">

                        <div class="contact-content">

                            <div class="section-heading" style="text-align:left; margin-bottom:0;">

                                <div class="mini">
                                    LET'S TALK
                                </div>

                                <h2>
                                    READY TO<br>
                                    ROLL?
                                </h2>

                                <p>
                                    Have a question about renting the RV,
                                    availability, or our service area?
                                    Reach out and let's get your adventure moving.
                                </p>

                            </div>


                            <div class="contact-buttons">

                                <a
                                    class="button button-primary"
                                    href="mailto:easybreezyrv@gmail.com">
                                    ✉ EMAIL US
                                </a>

                                <a
                                    class="button button-secondary"
                                    href="tel:+17272199954">
                                    ☎ CALL US
                                </a>

                                <a
                                    class="button button-secondary"
                                    href="sms:+17272199954">
                                    💬 TEXT US
                                </a>

                            </div>

                        </div>


                        <div class="contact-card">

                            <div class="contact-card-title">
                                📍 Service Area
                            </div>

                            <div class="map">

                                <iframe
                                    src="https://www.google.com/maps?q=28.0,-82.5&z=9&output=embed"
                                    loading="lazy"
                                    referrerpolicy="no-referrer-when-downgrade"
                                    allowfullscreen>
                                </iframe>

                                <a
                                    class="button button-primary map-button"
                                    href="https://www.google.com/maps/search/?api=1&query=Pinellas+County+Hillsborough+County+Florida"
                                    target="_blank"
                                    rel="noopener noreferrer">
                                    VIEW SERVICE AREA →
                                </a>

                            </div>

                        </div>

                    </div>

                </section>

            </main>


            <footer>

                <div class="container">

                    <div class="footer-links">

                        <a href="terms">Terms and Conditions</a>

                        <span class="separator">•</span>

                        <a href="privacy-policy">Privacy Policy</a>

                        <span class="separator">•</span>

                        <a href="cookies">Cookies</a>

                    </div>

                    <div class="copyright">
                        © ${new Date().getFullYear()} Easy Breezy RV ·
                        Your Home Away From Home 🚐
                    </div>

                </div>

            </footer>


            <a
                href="#home"
                id="scroll-top"
                aria-label="Scroll to the top">
                ↑
            </a>
        `;


        /* =========================================================
           MOBILE MENU
        ========================================================= */

        const menuToggle = document.getElementById("menuToggle");
        const siteNav = document.getElementById("siteNav");

        menuToggle.addEventListener("click", () => {

            const open = siteNav.classList.toggle("open");

            menuToggle.setAttribute("aria-expanded", open ? "true" : "false");

            menuToggle.innerHTML = open ? "✕ CLOSE" : "☰ MENU";

        });


        document.querySelectorAll("nav a").forEach(link => {

            link.addEventListener("click", () => {

                siteNav.classList.remove("open");

                menuToggle.setAttribute("aria-expanded", "false");

                menuToggle.innerHTML = "☰ MENU";

            });

        });


        /* =========================================================
           SCROLL TO TOP
        ========================================================= */

        const scrollTop = document.getElementById("scroll-top");

        window.addEventListener("scroll", () => {

            if (window.scrollY > 500) {
                scrollTop.classList.add("visible");
            } else {
                scrollTop.classList.remove("visible");
            }

        });


        /* =========================================================
           HERO PARTICLES
        ========================================================= */

        const particleContainer = document.getElementById("particles");

        for (let i = 0; i < 28; i++) {

            const particle = document.createElement("div");

            particle.className = "particle";

            particle.style.left = Math.random() * 100 + "%";

            particle.style.bottom = (-10 - Math.random() * 20) + "%";

            particle.style.animationDuration =
                (7 + Math.random() * 12) + "s";

            particle.style.animationDelay =
                (-Math.random() * 15) + "s";

            particle.style.width =
                (2 + Math.random() * 5) + "px";

            particle.style.height =
                particle.style.width;

            particleContainer.appendChild(particle);
        }


        /* =========================================================
           BUTTON RIPPLE EFFECT
        ========================================================= */

        document.querySelectorAll(".button").forEach(button => {

            button.addEventListener("click", event => {

                const ripple = document.createElement("span");

                ripple.style.position = "absolute";
                ripple.style.width = "10px";
                ripple.style.height = "10px";
                ripple.style.borderRadius = "50%";
                ripple.style.background = "rgba(255,255,255,.35)";
                ripple.style.pointerEvents = "none";

                const rect = button.getBoundingClientRect();

                ripple.style.left =
                    (event.clientX - rect.left - 5) + "px";

                ripple.style.top =
                    (event.clientY - rect.top - 5) + "px";

                ripple.style.transform = "scale(1)";
                ripple.style.opacity = "1";
                ripple.style.transition =
                    "transform .6s ease, opacity .6s ease";

                button.style.position = "relative";
                button.style.overflow = "hidden";

                button.appendChild(ripple);

                requestAnimationFrame(() => {
                    ripple.style.transform = "scale(35)";
                    ripple.style.opacity = "0";
                });

                setTimeout(() => {
                    ripple.remove();
                }, 650);

            });

        });


        /* =========================================================
           REVEAL ANIMATION
        ========================================================= */

        const revealStyle = document.createElement("style");

        revealStyle.textContent = `
            .feature-card,
            .rvshare-card,
            .contact-content,
            .contact-card {
                opacity: 0;
                transform: translateY(30px);
                transition:
                    opacity .7s ease,
                    transform .7s cubic-bezier(.2,.8,.2,1);
            }

            .reveal-visible {
                opacity: 1 !important;
                transform: translateY(0) !important;
            }
        `;

        document.head.appendChild(revealStyle);


        const revealItems = document.querySelectorAll(
            ".feature-card, .rvshare-card, .contact-content, .contact-card"
        );


        const revealObserver = new IntersectionObserver(
            entries => {

                entries.forEach(entry => {

                    if (entry.isIntersecting) {

                        entry.target.classList.add("reveal-visible");

                        revealObserver.unobserve(entry.target);

                    }

                });

            },
            {
                threshold: .12
            }
        );


        revealItems.forEach(item => {
            revealObserver.observe(item);
        });


        /* =========================================================
           FEATURE CARD STAGGER
        ========================================================= */

        document.querySelectorAll(".feature-card").forEach((card, index) => {

            card.style.transitionDelay =
                (index * 70) + "ms";

        });

    </script>

</body>
</html>
